# AnyLive local dependencies (P0)
# Usage: docker compose -f deploy/docker-compose.yml up -d
name: anylive

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anylive
      POSTGRES_PASSWORD: anylive
      POSTGRES_DB: anylive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anylive -d anylive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  # SRS: RTMP ingest + HTTP-FLV/HLS for local push/play
  srs:
    image: ossrs/srs:5
    ports:
      - "1935:1935"   # RTMP
      - "1985:1985"   # API
      - "8080:8080"   # HTTP play
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
    command: ["./objs/srs", "-c", "conf/docker.conf"]

volumes:
  pgdata:
  miniodata:
