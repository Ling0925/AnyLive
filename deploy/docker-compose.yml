# AnyLive local / test stack
# Deps only:  docker compose -f deploy/docker-compose.yml up -d
# Full test:  ./scripts/deploy-test.sh
name: anylive

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anylive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anylive}
      POSTGRES_DB: ${POSTGRES_DB:-anylive}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anylive} -d ${POSTGRES_DB:-anylive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  srs:
    image: ossrs/srs:5
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
    command: ["./objs/srs", "-c", "conf/docker.conf"]

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: anylive-api:test
    ports:
      - "8088:8088"
    environment:
      APP_ENV: local
      API_BIND: 0.0.0.0:8088
      RUST_LOG: info,anylive_api=info
      USE_POSTGRES: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-anylive}:${POSTGRES_PASSWORD:-anylive}@postgres:5432/${POSTGRES_DB:-anylive}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-test-access-secret-change-me-32ch}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test-refresh-secret-change-me-32ch}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-anylive-dev-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-anylive-dev-token-secret-change-me}
      SRS_RTMP_URL: rtmp://localhost:1935/live
      SRS_HLS_BASE: http://localhost:8080/live
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      srs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  admin:
    profiles: ["app"]
    build:
      context: ../apps/admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8088}
    image: anylive-admin:test
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
