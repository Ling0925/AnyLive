# AnyLive 本地开发用最小 SRS 配置。
#
# 推流：OBS 串流密钥 = {room_id}?exp={unix}&sig={hex}
#   - RTMP stream name 是裸 room UUID（稳定 HLS 路径）
#   - exp/sig 走 query，由 API on_publish 校验
# 播放/HLS 始终用裸 room_id：live/{room_id}.m3u8
#
# HTTP hooks：OBS 开始/停止推流时回调控制面 API。
# API 校验签名；若配置了 SRS_WEBHOOK_SECRET，须在 URL 上带 ?secret=
# （SRS 原生 http_hooks 无法设置自定义 Header）。
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # Point at the API (host network / docker host).
    # secret= 须与 API 的 SRS_WEBHOOK_SECRET 一致（默认见 deploy/.env.test）。
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8088/api/v1/webhooks/srs/on_publish?secret=test-srs-webhook-secret;
        on_unpublish    http://host.docker.internal:8088/api/v1/webhooks/srs/on_unpublish?secret=test-srs-webhook-secret;
    }
}
