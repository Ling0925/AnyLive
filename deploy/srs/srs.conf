# Minimal SRS config for AnyLive local development.
#
# Publish stream names are HMAC-signed keys from media/publish:
#   {room_id}_{exp}_{sig}  (not bare room UUIDs)
# Play/HLS still uses the bare room id path when configured that way.
#
# HTTP hooks call the control-plane API when OBS starts/stops publishing.
# The API validates the signed stream key on on_publish / on_unpublish
# (and checks SRS_WEBHOOK_SECRET when set).
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/stream].m3u8;
        hls_ts_file     [app]/stream]-[seq].ts;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/app]/stream].flv;
    }

    # Point at the API (host network / docker host). Override for prod.
    # host.docker.internal works on Docker Desktop; Linux may need
    # extra_hosts or host gateway IP instead.
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8088/api/v1/webhooks/srs/on_publish;
        on_unpublish    http://host.docker.internal:8088/api/v1/webhooks/srs/on_unpublish;
    }
}
