name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate-contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate OpenAPI TS types
        run: bash scripts/gen-openapi-ts.sh
      - name: Check generated OpenAPI TS is committed
        run: |
          git add apps/admin-web/src/generated/openapi.d.ts apps/h5-web/src/generated/openapi.d.ts
          git diff --cached --exit-code -- apps/admin-web/src/generated/openapi.d.ts apps/h5-web/src/generated/openapi.d.ts \
            || (echo "Run ./scripts/gen-openapi-ts.sh and commit generated types" && exit 1)
      - run: bash scripts/smoke-compose.sh
        env:
          # compose config validation only needs docker when available
          SKIP_DOCKER: "0"

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, h5-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  # Non-blocking: boots memory-mode API and runs control-plane dogfood smoke.
  # Does not gate merge; evidence for Wave1 collective DoD §12 control-plane green.
  # Label: control-plane only — does NOT close V-BE-1/2 or sign risk-accept docs.
  dogfood-api-smoke:
    name: dogfood (control-plane only — not V-BE-1/2)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build anylive-api
        working-directory: backend
        run: cargo build -p anylive-api --release
      - name: Start memory API + dogfood smokes
        env:
          APP_ENV: local
          ALLOW_DEV_OTP: "1"
          ALLOW_MOCK_TOPUP: "1"
          OTP_NOTIFIER: noop
          PAY_CHANNELS: mock
          PAY_ENABLE_MOCK: "1"
          PAY_MOCK_SECRET: ci-pay-mock-secret-change-me
          PAY_PUBLIC_BASE_URL: http://127.0.0.1:8088
          CHAT_BLOCKLIST: spamword
          FEATURE_PK: "0"
          FEATURE_COHOST: "0"
          JWT_ACCESS_SECRET: ci-access-secret-change-me-32ch
          JWT_REFRESH_SECRET: ci-refresh-secret-change-me-32ch
          API_BIND: 127.0.0.1:8088
          RUST_LOG: warn
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "## Dogfood CI (control-plane only)"
            echo ""
            echo "This job is **non-blocking** (\`continue-on-error: true\`) and **does not close V-BE-1/2**."
            echo "Unsigned risk-accept drafts: \`docs/runbooks/otp-dev-only-risk-accept.md\`, \`docs/runbooks/ws-1k-soak-risk-accept.md\`."
            echo "FEATURE_PK=0 FEATURE_COHOST=0 (P1-safe)."
          } >> "$GITHUB_STEP_SUMMARY"
          ./backend/target/release/anylive-api > reports/ci-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process exited early" >&2
              tail -n 80 reports/ci-api.log || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8088/health
          echo "=== dogfood-api-smoke ==="
          API_BASE=http://127.0.0.1:8088 OTP_CODE=123456 \
            ./scripts/dogfood-api-smoke.sh | tee reports/dogfood-api-smoke-ci.txt
          grep -q DOGFOOD_API_SMOKE_PASS reports/dogfood-api-smoke-ci.txt
          echo "=== dogfood-10min-path ==="
          API_BASE=http://127.0.0.1:8088 OTP_CODE=123456 \
            ./scripts/dogfood-10min-path.sh | tee reports/dogfood-10min-path-ci.txt
          grep -q DOGFOOD_10MIN_PATH_PASS reports/dogfood-10min-path-ci.txt
          {
            echo ""
            echo "| Script | Result |"
            echo "|---|---|"
            echo "| dogfood-api-smoke | PASS (control-plane) |"
            echo "| dogfood-10min-path | PASS (control-plane) |"
            echo ""
            echo "**Not** V-BE-1/2 signed. Human OBS / ESP / soak still required for exit gates."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dogfood smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-control-plane
          path: |
            reports/dogfood-api-smoke-ci.txt
            reports/dogfood-10min-path-ci.txt
            reports/ci-api.log
          if-no-files-found: ignore
