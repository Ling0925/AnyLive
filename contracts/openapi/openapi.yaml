openapi: 3.1.0
info:
  title: AnyLive API
  version: 0.1.0
  description: |
    AnyLive overseas-first live streaming control plane.
    P0 surface: system health + meta. Auth/rooms freeze in v0.1/v0.2.
servers:
  - url: http://localhost:8088
    description: Local API
tags:
  - name: system
    description: Health and metadata
  - name: auth
    description: Authentication (stub paths for freeze)
  - name: users
    description: User profile (stub paths for freeze)
  - name: rooms
    description: Rooms (stub paths for freeze)
  - name: webhooks
    description: webhooks
  - name: moderation
    description: moderation
  - name: social
    description: social
  - name: admin
    description: admin
  - name: realtime
    description: realtime
  - name: gifts
    description: gifts
  - name: wallet
    description: wallet
  - name: compliance
    description: Account export/delete and legal documents
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      operationId: ready
      summary: Readiness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/v1/meta:
    get:
      tags: [system]
      operationId: meta
      summary: Service metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /api/v1/auth/otp/send:
    post:
      tags: [auth]
      operationId: authOtpSend
      summary: Send email OTP (P1)
      description: Stub contract — implemented in auth milestone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "204":
          description: OTP sent (or silently accepted)
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: authOtpVerify
      summary: Verify OTP and issue tokens (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Tokens + user issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      operationId: authTokenRefresh
      summary: Rotate refresh token (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke refresh token(s) (P1)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Current user profile (P1)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [users]
      operationId: patchMe
      summary: Update display name and age/privacy declarations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [compliance]
      operationId: deleteMe
      summary: Soft-delete account and revoke refresh tokens
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/export:
    get:
      tags: [compliance]
      operationId: exportMe
      summary: Export current account data (P1 stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/legal/privacy:
    get:
      tags: [compliance]
      operationId: legalPrivacy
      summary: Privacy policy link (public)
      responses:
        "200":
          description: Privacy policy document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDoc"
  /api/v1/legal/terms:
    get:
      tags: [compliance]
      operationId: legalTerms
      summary: Terms of service link (public)
      responses:
        "200":
          description: Terms document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDoc"
  /api/v1/rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room (P1)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Error"
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List live/hot rooms (P1)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [idle, live, closed]
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
  /api/v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get room by id
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: {type: integer, format: int64}
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/wallet/ledger:
    get:
      tags: [wallet]
      operationId: getWalletLedger
      summary: List wallet ledger entries for current user
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerList"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/wallet/topups:
    post:
      tags: [wallet]
      operationId: topupWallet
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {type: integer, format: int64}
      responses:
        "200": {description: Updated balance}
  /api/v1/gifts:
    get:
      tags: [gifts]
      operationId: listGifts
      responses:
        "200": {description: Gift catalog}
  /api/v1/rooms/{roomId}/gifts:
    post:
      tags: [gifts]
      operationId: sendGift
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gift_id, receiver_id, client_request_id]
              properties:
                gift_id: {type: string, format: uuid}
                receiver_id: {type: string, format: uuid}
                count: {type: integer, default: 1}
                client_request_id: {type: string}
      responses:
        "201": {description: Created}
        "200": {description: Idempotent replay}
  /api/v1/rooms/{roomId}/start:
    post:
      tags: [rooms]
      operationId: startRoom
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Live}
  /api/v1/rooms/{roomId}/stop:
    post:
      tags: [rooms]
      operationId: stopRoom
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Idle}
  /api/v1/rooms/{roomId}/media/publish:
    post:
      tags: [rooms]
      operationId: mediaPublish
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Publish info}
  /api/v1/rooms/{roomId}/media/play:
    get:
      tags: [rooms]
      operationId: mediaPlay
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Play URLs}
  /api/v1/rooms/{roomId}/messages:
    get:
      tags: [realtime]
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Chat history}
    post:
      tags: [realtime]
      operationId: postMessage
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
      responses:
        "201": {description: Created}
  /api/v1/realtime/token:
    post:
      tags: [realtime]
      operationId: realtimeToken
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: {type: string, format: uuid}
      responses:
        "200": {description: Centrifugo token}
  /api/v1/admin/grant:
    post:
      tags: [admin]
      operationId: adminGrant
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Granted}
  /api/v1/admin/ban:
    post:
      tags: [admin]
      operationId: adminBan
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserRequest"
      responses:
        "204": {description: Banned}
  /api/v1/admin/mute:
    post:
      tags: [admin]
      operationId: adminMute
      summary: Mute a user (blocks chat and gifts)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteUserRequest"
      responses:
        "204":
          description: Muted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/unmute:
    post:
      tags: [admin]
      operationId: adminUnmute
      summary: Unmute a user
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnmuteUserRequest"
      responses:
        "204":
          description: Unmuted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/rooms/force-close:
    post:
      tags: [admin]
      operationId: adminForceClose
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Closed}
  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminAudit
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Audit list}
  /api/v1/admin/gifts:
    get:
      tags: [admin]
      operationId: adminListGifts
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Gifts}
    post:
      tags: [admin]
      operationId: adminUpsertGift
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Upserted}
  /api/v1/admin/reports:
    get:
      tags: [admin]
      operationId: adminListReports
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Reports}
  /api/v1/admin/reports/{reportId}:
    patch:
      tags: [admin]
      operationId: adminResolveReport
      summary: Resolve a report (status must be resolved)
      security: [{bearerAuth: []}]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportRequest"
      responses:
        "200":
          description: Resolved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/users/{userId}/follow:
    post:
      tags: [social]
      operationId: followUser
      security: [{bearerAuth: []}]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Following}
    delete:
      tags: [social]
      operationId: unfollowUser
      security: [{bearerAuth: []}]
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: Unfollowed}
  /api/v1/me/following:
    get:
      tags: [social]
      operationId: listFollowing
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Following ids}
  /api/v1/feed/hot:
    get:
      tags: [social]
      operationId: feedHot
      responses:
        "200": {description: Live rooms}
  /api/v1/feed/following:
    get:
      tags: [social]
      operationId: feedFollowing
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Following live rooms}
  /api/v1/reports:
    post:
      tags: [moderation]
      operationId: createReport
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Report created}
  /api/v1/webhooks/srs/on_publish:
    post:
      tags: [webhooks]
      operationId: srsOnPublish
      responses:
        "200": {description: SRS code 0 allow / 1 deny}
  /api/v1/webhooks/srs/on_unpublish:
    post:
      tags: [webhooks]
      operationId: srsOnUnpublish
      responses:
        "200": {description: OK}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: anylive-api
    ReadyResponse:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
    MetaResponse:
      type: object
      required: [name, version, api_version]
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
          example: v1
    ApiError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
    OtpSendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 4
          maxLength: 8
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime seconds
    AuthSession:
      type: object
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    User:
      type: object
      required: [id, display_name, created_at, age_confirmed, privacy_accepted]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        age_confirmed:
          type: boolean
        privacy_accepted:
          type: boolean
    PatchMeRequest:
      type: object
      properties:
        display_name:
          type: string
        age_confirmed:
          type: boolean
        privacy_accepted:
          type: boolean
      description: At least one field is required
    AccountExport:
      type: object
      required: [user, rooms_owned_count, note]
      properties:
        user:
          $ref: "#/components/schemas/User"
        rooms_owned_count:
          type: integer
          format: int64
        note:
          type: string
    LegalDoc:
      type: object
      required: [url, version, title]
      properties:
        url:
          type: string
          format: uri
        version:
          type: string
        title:
          type: string
    LedgerEntry:
      type: object
      required: [id, amount, balance_after, entry_type, reference, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        entry_type:
          type: string
          enum: [topup, gift_debit, gift_credit, adjustment]
        reference:
          type: string
        created_at:
          type: string
          format: date-time
    LedgerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
    BanUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    MuteUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    UnmuteUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    ResolveReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved]
        note:
          type: string
    AdminReport:
      type: object
      required: [id, reporter_id, target_type, target_id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [open, resolved]
        note:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRoomRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
    Room:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [idle, live, closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
