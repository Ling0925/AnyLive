openapi: 3.1.0
info:
  title: AnyLive API
  version: 0.1.0
  description: |
    AnyLive overseas-first live streaming control plane.
    P0 surface: system health + meta. Auth/rooms freeze in v0.1/v0.2.
servers:
  - url: http://localhost:8088
    description: Local API
tags:
  - name: system
    description: Health and metadata
  - name: auth
    description: Authentication (stub paths for freeze)
  - name: users
    description: User profile (stub paths for freeze)
  - name: rooms
    description: Rooms (stub paths for freeze)
  - name: webhooks
    description: webhooks
  - name: moderation
    description: moderation
  - name: social
    description: social
  - name: admin
    description: admin
  - name: realtime
    description: realtime
  - name: gifts
    description: gifts
  - name: wallet
    description: wallet
  - name: pay
    description: PayProvider control plane (channels, products, orders, webhooks)
  - name: compliance
    description: Account export/delete and legal documents
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      operationId: ready
      summary: Readiness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /metrics:
    get:
      tags: [system]
      operationId: metrics
      summary: Minimal Prometheus text metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /api/v1/meta:
    get:
      tags: [system]
      operationId: meta
      summary: Service metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
  /api/v1/auth/otp/send:
    post:
      tags: [auth]
      operationId: authOtpSend
      summary: Send email OTP (P1)
      description: Stub contract — implemented in auth milestone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "204":
          description: OTP sent (or silently accepted)
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: authOtpVerify
      summary: Verify OTP and issue tokens (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Tokens + user issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/oauth/exchange:
    post:
      tags: [auth]
      operationId: authOauthExchange
      summary: Exchange OAuth id_token for session (WBS E2.1 scaffold)
      description: |
        Local/dogfood: `id_token = "stub:<email>"` when OAUTH_STUB=1 or local APP_ENV.
        Production forbids stub. Real Google/Apple JWKS verification still needs vendor config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthExchangeRequest"
      responses:
        "200":
          description: Tokens + user issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      operationId: authTokenRefresh
      summary: Rotate refresh token (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoke refresh token(s) (P1)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: List active refresh sessions (jti only; WBS E2.4)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [auth]
      operationId: logoutAllSessions
      summary: Revoke all refresh sessions for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions/{jti}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Revoke a single refresh session by jti (must belong to caller)
      security:
        - bearerAuth: []
      parameters:
        - name: jti
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/push-tokens:
    get:
      tags: [users]
      operationId: listPushTokens
      summary: List registered device push tokens (WBS E8.9 scaffold; no delivery)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceListResponse"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [users]
      operationId: registerPushToken
      summary: Register or upsert a device push token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [users]
      operationId: unregisterPushToken
      summary: Unregister a device push token owned by the caller
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "204":
          description: Unregistered
        "404":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/push-tokens/test:
    post:
      tags: [users]
      operationId: testPush
      summary: Fire a test push via configured delivery backend (noop by default)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTestRequest"
      responses:
        "200":
          description: Delivery attempt summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/me/avatar/presign:
    post:
      tags: [users]
      operationId: avatarPresign
      summary: Issue short-lived avatar upload URL (MinIO or synthetic)
      security: [{bearerAuth: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarPresignRequest"
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarPresignResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/avatar/confirm:
    post:
      tags: [users]
      operationId: avatarConfirm
      summary: Confirm avatar URL after client PUT
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarConfirmRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/avatar/blob:
    put:
      tags: [users]
      operationId: avatarBlobPut
      summary: Synthetic avatar blob sink when MinIO is disabled
      security: [{bearerAuth: []}]
      parameters:
        - name: object_key
          in: query
          required: true
          schema: {type: string}
        - name: expires
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        "204":
          description: Blob accepted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Current user profile (P1)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [users]
      operationId: patchMe
      summary: Update display name and age/privacy declarations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    delete:
      tags: [compliance]
      operationId: deleteMe
      summary: Soft-delete account and revoke refresh tokens
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/export:
    get:
      tags: [compliance]
      operationId: exportMe
      summary: Export current account data (P1 stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account export payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/creator:
    get:
      tags: [users]
      operationId: creatorStats
      summary: Creator center stats (followers, rooms, gift income)
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Creator dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorStatsResponse"

  /api/v1/legal/privacy:
    get:
      tags: [compliance]
      operationId: legalPrivacy
      summary: Privacy policy link (public)
      responses:
        "200":
          description: Privacy policy document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDoc"
  /api/v1/legal/terms:
    get:
      tags: [compliance]
      operationId: legalTerms
      summary: Terms of service link (public)
      responses:
        "200":
          description: Terms document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDoc"
  /api/v1/rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room (P1)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Error"
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List live/hot rooms (P1)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [idle, live, closed]
      responses:
        "200":
          description: Room list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
  /api/v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get room by id
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: {type: integer, format: int64}
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/wallet/ledger:
    get:
      tags: [wallet]
      operationId: getWalletLedger
      summary: List wallet ledger entries for current user
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerList"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/wallet/topups:
    post:
      tags: [wallet]
      operationId: topupWallet
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {type: integer, format: int64}
      responses:
        "200": {description: Updated balance}
  /api/v1/gifts:
    get:
      tags: [gifts]
      operationId: listGifts
      responses:
        "200": {description: Gift catalog}
  /api/v1/rooms/{roomId}/gifts:
    post:
      tags: [gifts]
      operationId: sendGift
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gift_id, receiver_id, client_request_id]
              properties:
                gift_id: {type: string, format: uuid}
                receiver_id: {type: string, format: uuid}
                count: {type: integer, default: 1}
                client_request_id: {type: string}
      responses:
        "201": {description: Created}
        "200": {description: Idempotent replay}
  /api/v1/rooms/{roomId}/start:
    post:
      tags: [rooms]
      operationId: startRoom
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Live}
  /api/v1/rooms/{roomId}/stop:
    post:
      tags: [rooms]
      operationId: stopRoom
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Idle}
  /api/v1/rooms/{roomId}/stats:
    get:
      tags: [rooms]
      operationId: roomStats
      summary: Online count (heartbeat TTL) + like total (WBS E4.4)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStats"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rooms/{roomId}/presence:
    post:
      tags: [rooms]
      operationId: roomPresenceHeartbeat
      summary: Presence heartbeat while viewer is in room
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Current online count after heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceHeartbeatResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rooms/{roomId}/likes:
    post:
      tags: [rooms]
      operationId: roomLike
      summary: Increment room like counter (light per-user cooldown)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_request_id:
                  type: string
      responses:
        "200":
          description: Like result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeRoomResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rooms/{roomId}/recording:
    get:
      tags: [rooms]
      operationId: getRecording
      summary: Room recording flag (control plane, no media egress)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Recording status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [rooms]
      operationId: setRecording
      summary: Owner-only recording enable/disable switch
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: Updated recording status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/rooms/{roomId}/media/publish:
    post:
      tags: [rooms]
      operationId: mediaPublish
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Publish info}
  /api/v1/rooms/{roomId}/media/play:
    get:
      tags: [rooms]
      operationId: mediaPlay
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": {description: Play URLs}
  /api/v1/rooms/{roomId}/livekit/join:
    post:
      tags: [rooms]
      operationId: livekitJoin
      summary: Issue LiveKit join credentials (P3 interactive scaffold)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveKitJoinRequest"
      responses:
        "200":
          description: Join credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitJoinResponse"
        "403":
          description: Host role restricted to room owner
        "503":
          description: LiveKit not configured
  /api/v1/rooms/{roomId}/interactive/invite:
    post:
      tags: [rooms]
      operationId: interactiveInvite
      summary: Host invites a user to co-host (P3)
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractiveInviteRequest"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSession"
        "403": {description: Not room owner}
        "409": {description: Conflict / seat full}
  /api/v1/rooms/{roomId}/interactive/respond:
    post:
      tags: [rooms]
      operationId: interactiveRespond
      summary: Invitee accepts or declines co-host invite
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractiveRespondRequest"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSession"
        "404": {description: No pending invite}
  /api/v1/rooms/{roomId}/interactive/leave:
    post:
      tags: [rooms]
      operationId: interactiveLeave
      summary: Leave or end co-host session
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSession"
        "404": {description: No active session}
  /api/v1/rooms/{roomId}/interactive:
    get:
      tags: [rooms]
      operationId: listInteractiveSessions
      summary: List interactive sessions for a room
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractiveSessionList"
  /api/v1/rooms/{roomId}/pk:
    get:
      tags: [rooms]
      operationId: getPkSession
      summary: Current PK session for room (if any)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: PK state (null session when idle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkSessionResponse"
  /api/v1/rooms/{roomId}/pk/start:
    post:
      tags: [rooms]
      operationId: startPk
      summary: Start a timed PK against another live room
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPkRequest"
      responses:
        "201":
          description: PK started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkSession"
        "403": {description: Not room owner}
        "409": {description: Already in PK or opponent not live}
  /api/v1/rooms/{roomId}/pk/end:
    post:
      tags: [rooms]
      operationId: endPk
      summary: End active PK early (host) or when timer expires
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: PK ended with scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkSession"
        "404": {description: No active PK}
  /api/v1/events:
    post:
      tags: [analytics]
      operationId: ingestClientEvents
      summary: Client analytics event batch (P4 scaffold)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEventBatch"
      responses:
        "202":
          description: Accepted
          content:
