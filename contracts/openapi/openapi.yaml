components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: anylive-api
    ReadyResponse:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
    MetaFeatures:
      type: object
      required: [public_register, real_pay, pk, cohost, client_events]
      properties:
        public_register:
          type: boolean
        real_pay:
          type: boolean
        pk:
          type: boolean
          description: P3 PK; default false when unset
        cohost:
          type: boolean
          description: P3 co-host; default false when unset
        client_events:
          type: boolean
    MetaResponse:
      type: object
      required: [name, version, api_version, media_provider, features]
      properties:
        name:
          type: string
        version:
          type: string
        api_version:
          type: string
        media_provider:
          type: string
          description: Broadcast backend (srs | cloudflare_stream)
          example: srs
        features:
          $ref: "#/components/schemas/MetaFeatures"
    ApiError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
    OtpSendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    OtpVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 4
          maxLength: 8
    OauthExchangeRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider:
          type: string
          description: google | apple
        id_token:
          type: string
          description: Provider ID token; local dogfood may use stub:<email>
        invite_code:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime seconds
    AuthSession:
      type: object
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
    Session:
      type: object
      required: [jti, expires_at]
      properties:
        jti:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    LogoutAllResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          format: int64
    PushRegisterRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          maxLength: 512
        platform:
          type: string
          description: ios | android | web | other
    PushDevice:
      type: object
      required: [id, platform, token, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        token:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PushDeviceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PushDevice"
    PushTestRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        token:
          type: string
          description: Optional single device token; omit to fan out to all of user
    PushTestResponse:
      type: object
      required: [delivery, attempted, succeeded]
      properties:
        delivery:
          type: string
          description: noop | log | http
        attempted:
          type: integer
        succeeded:
          type: integer
    RoomStats:
      type: object
      required: [room_id, online_count, like_count, recording_enabled]
      properties:
        room_id:
          type: string
          format: uuid
        online_count:
          type: integer
          format: int64
        like_count:
          type: integer
          format: int64
        recording_enabled:
          type: boolean
    RecordingStatus:
      type: object
      required: [room_id, recording_enabled]
      properties:
        room_id:
          type: string
          format: uuid
        recording_enabled:
          type: boolean
    AvatarPresignRequest:
      type: object
      properties:
        content_type:
          type: string
    AvatarPresignResponse:
      type: object
      required: [object_key, upload_url, public_url, method, expires_in, headers]
      properties:
        object_key: {type: string}
        upload_url: {type: string}
        public_url: {type: string}
        method: {type: string}
        expires_in: {type: integer, format: int64}
        headers:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string}
              value: {type: string}
    AvatarConfirmRequest:
      type: object
      required: [object_key]
      properties:
        object_key: {type: string}
        public_url: {type: string}
    PresenceHeartbeatResponse:
      type: object
      required: [online_count]
      properties:
        online_count:
          type: integer
          format: int64
    LikeRoomResponse:
      type: object
      required: [accepted, like_count]
      properties:
        accepted:
          type: boolean
        like_count:
          type: integer
          format: int64
    SearchResponse:
      type: object
      required: [users, rooms]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/Room"
    User:
      type: object
      required: [id, display_name, created_at, age_confirmed, privacy_accepted]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        age_confirmed:
          type: boolean
        privacy_accepted:
          type: boolean
        avatar_url:
          type: string
          format: uri
          description: Public avatar object URL when set
        region:
          type: string
          description: Optional ISO 3166-1 alpha-2 region / country code
    PatchMeRequest:
      type: object
      properties:
        display_name:
          type: string
        age_confirmed:
          type: boolean
        privacy_accepted:
          type: boolean
        region:
          type: string
          description: ISO region code; empty string clears
      description: At least one field is required
    AccountExport:
      type: object
      required: [user, rooms_owned_count, note]
      properties:
        user:
          $ref: "#/components/schemas/User"
        rooms_owned_count:
          type: integer
          format: int64
        note:
          type: string
    LegalDoc:
      type: object
      required: [url, version, title]
      properties:
        url:
          type: string
          format: uri
        version:
          type: string
        title:
          type: string
    LedgerEntry:
      type: object
      required: [id, amount, balance_after, entry_type, reference, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        entry_type:
          type: string
          enum: [topup, gift_debit, gift_credit, adjustment]
        reference:
          type: string
        created_at:
          type: string
          format: date-time
    LedgerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
    BanUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    GrantAdminRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          description: admin | moderator | ops (default admin)
          enum: [admin, moderator, ops]
    MuteUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    UnmuteUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          type: string
    ResolveReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved]
        note:
          type: string
    AdminReport:
      type: object
      required: [id, reporter_id, target_type, target_id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [open, resolved]
        note:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRoomRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
    PayChannel:
      type: object
      required: [id, title, pay_modes]
      properties:
        id:
          type: string
          example: mock
        title:
          type: string
        pay_modes:
          type: array
          items:
            type: string
    PayChannelListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayChannel"
    PayProduct:
      type: object
      required: [id, sku, title, coins, amount, currency]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
        coins:
          type: integer
          format: int64
        amount:
          type: string
          description: Display amount (e.g. "0.99")
        currency:
          type: string
          example: USD
    PayProductListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PayProduct"
    CreatePayOrderRequest:
      type: object
      required: [product_id, channel]
      properties:
        product_id:
          type: string
          format: uuid
        channel:
          type: string
          example: mock
        client_request_id:
          type: string
        return_url:
          type: string
          format: uri
        extra:
          type: object
          additionalProperties: true
    PayOrder:
      type: object
      required: [id, status, coins, amount, currency, channel]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          example: pending
        coins:
          type: integer
          format: int64
        amount:
          type: string
        currency:
          type: string
        channel:
          type: string
